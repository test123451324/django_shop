{% extends "shop/base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
    <h1>Вхід</h1>
    {% if error %}
    <p>
        {{error}}
    </p>
    {% endif %}
    <form method="post" class="form">
        {% csrf_token %}
        {% if next %}
        <input type="hidden" name="next" value="{{next}}">
        {% endif %}
        {{form.as_p}}
        <button type="submit">Увійти</button>
    </form>
<p>Ще немає аккаунту?
    <a href="{% url 'register' %}">Зареєструватись</a>
</p>
{% endblock %}
